name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME}}/tetris

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha}} .
          echo "Image built: $IMAGE_NAME:${{ github.sha }}"

      - name: Save Image as tar file
        run: |
          docker save $IMAGE_NAME:${{github.sha}} -o tetris-image.tar
          echo "Image saved as tetris-image.tar"

      - name: Upload Image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetris-image
          path: tetris-image.tar
          retention-days: 1

  scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Image artifact
        uses: actions/download-artifact@v4
        with: 
          name: tetris-image

      - name: Load Docker image
        run: |
          docker load -i tetris-image.tar
          echo "Image loaded from artifact"

      - name: Run trivy vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  sonarqube:
    name: SonarQube code quality
    runs-on: ubuntu-latest
    needs: scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env: 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_URL: ${{ secrets.SONAR_HOST_URL}}

      - name: Check Sonarqube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with: 
          name: tetris-image

      - name: Load Docker image
        run: |
          docker load -i tetris-image.tar
          echo "Image loaded from artifact"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with: 
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_PASSWORD}}

      - name: Push to Docker hub
        run: |
          docker tag $IMAGE_NAME:${{github.sha}} $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{github.sha}}
          docker push $IMAGE_NAME:latest
          echo "Pushed $IMAGE_NAME:${{github.sha}}"

      - name: Post build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`$IMAGE_NAME:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy:  No CRITICAL/HIGH CVEs" >> $GITHUB_STEP_SUMMARY
          echo "- SonarQube: Quality gate passed" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Pushed to Docker Hub" >> $GITHUB_STEP_SUMMARY

